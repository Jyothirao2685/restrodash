# ==============================================================================
# RestroDash Nginx Production Configuration (Cloudflare + Wildcard Subdomains)
# Domain: restrodash.in & *.restrodash.in
# ==============================================================================

# 1. Restore Real Visitor IPs from Cloudflare Proxies
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 2. Dynamic Subdomain Port Mapping
# Subdomains map to their allocated POS API port (3011, 3021, etc.)
# Default maps to port 3000 (SaaS Portal)
map $subdomain $tenant_port {
    hostnames;
    default 3000;
}

# 3. HTTP Server (Redirect all to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name restrodash.in *.restrodash.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Main Portal (restrodash.in & www.restrodash.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restrodash.in www.restrodash.in;

    # Cloudflare Origin CA Certificates (15-year free cert)
    ssl_certificate /opt/restrodash/ssl/cert.pem;
    ssl_certificate_key /opt/restrodash/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Proxy to Next.js SaaS Marketing & Onboarding Portal (:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 5. HTTPS Wildcard Subdomains (*.restrodash.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.restrodash\.in$;

    # Cloudflare Origin CA Certificates
    ssl_certificate /opt/restrodash/ssl/cert.pem;
    ssl_certificate_key /opt/restrodash/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Dynamic Proxy to Tenant's Assigned Instance Port
    location / {
        proxy_pass http://127.0.0.1:$tenant_port;
        proxy_http_version 1.1;

        # WebSocket support for KDS & live table cart sync
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
