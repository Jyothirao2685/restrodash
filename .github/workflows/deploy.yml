name: CI/CD Auto Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      # Deployment only runs on pushes to main when secrets are provided
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.LIGHTSAIL_HOST }}" ] && [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ LIGHTSAIL_HOST or LIGHTSAIL_SSH_KEY not configured in GitHub Secrets. Build passed, skipping VPS sync."
          fi

      - name: Prepare Standalone Deployment Bundle
        if: steps.check-secrets.outputs.configured == 'true' && github.event_name == 'push'
        run: |
          mkdir -p deploy-package
          cp -r .next/standalone/* deploy-package/
          mkdir -p deploy-package/.next
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public

      - name: Setup SSH Key
        if: steps.check-secrets.outputs.configured == 'true' && github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Deploy to AWS Lightsail
        if: steps.check-secrets.outputs.configured == 'true' && github.event_name == 'push'
        run: |
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete deploy-package/ ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/var/www/restrodash/

      - name: Restart Application via PM2
        if: steps.check-secrets.outputs.configured == 'true' && github.event_name == 'push'
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            cd /var/www/restrodash
            PORT=3000 pm2 start server.js --name "restrodash-saas" --update-env || pm2 restart "restrodash-saas"
            pm2 save
          EOF
