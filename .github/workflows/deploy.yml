name: CI/CD Auto Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.LIGHTSAIL_HOST }}" ] && [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Deployment secrets detected. Proceeding with deployment to ${{ secrets.LIGHTSAIL_HOST }}."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ LIGHTSAIL_HOST or LIGHTSAIL_SSH_KEY not configured in GitHub Secrets. Build passed, skipping VPS deployment."
          fi

      - name: Prepare Standalone Deployment Bundle
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          mkdir -p deploy-package
          cp -r .next/standalone/* deploy-package/
          mkdir -p deploy-package/.next
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public

      - name: Setup SSH Key
        if: steps.check-secrets.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Ensure Server Directory Exists
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            sudo mkdir -p /opt/restrodash/saas
            sudo chown -R $USER:$USER /opt/restrodash/saas
          EOF

      - name: Deploy Build to AWS Lightsail
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" deploy-package/ ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/restrodash/saas/

      - name: Restart Application via PM2
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            # Stop legacy process if running
            pm2 stop restrodash-portal 2>/dev/null || true
            pm2 delete restrodash-portal 2>/dev/null || true

            cd /opt/restrodash/saas
            PORT=3000 pm2 start server.js --name "restrodash-saas" --update-env || pm2 restart "restrodash-saas"
            pm2 save
          EOF
